# =============================================================================
# FairQ CI/CD Pipeline
# =============================================================================
# This workflow runs automatically when you push code to GitHub.
#
# What it does:
# 1. Runs on every push and pull request
# 2. Tests the backend (Python)
# 3. Builds the frontend
# 4. (Optional) Deploys to server
#
# HOW TO USE:
# Just push your code! GitHub will run this automatically.
# Check results at: https://github.com/NMenuX/fairq/actions
# =============================================================================

name: FairQ CI/CD

# When to run this workflow
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ===========================================================================
  # JOB 1: Test Backend
  # ===========================================================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      # Step 1: Download the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      
      # Step 4: Run tests (if you have any)
      - name: Run tests
        run: |
          # Create a test .env file
          echo "SECRET_KEY=test-secret" > .env
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          
          # Run the app import test (basic smoke test)
          python -c "from app.main import app; print('✅ Backend imports successfully')"
          
          # Run pytest if tests exist
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=app
          else
            echo "ℹ️ No tests directory found. Skipping pytest."
          fi

  # ===========================================================================
  # JOB 2: Build Frontends
  # ===========================================================================
  build-frontend:
    name: ⚛️ Build Frontends
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        frontend: [frontend-user, frontend-management, frontend-counter]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.frontend }}
          npm ci
      
      - name: Build
        run: |
          cd ${{ matrix.frontend }}
          npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.frontend }}-build
          path: ${{ matrix.frontend }}/dist

  # ===========================================================================
  # JOB 3: Build Docker Images (only on master branch)
  # ===========================================================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        run: |
          docker build -t fairq-backend:latest ./backend
          echo "✅ Backend Docker image built successfully"
      
      - name: Build frontend images
        run: |
          docker build -t fairq-kiosk:latest ./frontend-user
          docker build -t fairq-management:latest ./frontend-management
          docker build -t fairq-counter:latest ./frontend-counter
          echo "✅ All frontend Docker images built successfully"

  # ===========================================================================
