# =============================================================================
# FairQ - Docker Compose Configuration
# =============================================================================
# This runs all services together with one command: docker-compose up
#
# Services:
#   - api:        Backend API (FastAPI) on port 8000 (host:8000 -> container:8000)
#   - kiosk:      User-facing kiosk on port 5173
#   - management: Admin dashboard on port 5174
#   - counter:    Counter display on port 5175
# =============================================================================

services:
  # ===========================================================================
  # BACKEND API
  # ===========================================================================
  api:
    image: fairq-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=sqlite:////data/fairq.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - SMS_MOCK_MODE=true
      - SEED=1
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
    restart: unless-stopped
    healthcheck:
      # FastAPI redirects `/health` -> `/health/` (307). Check the canonical URL.
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # KIOSK FRONTEND (User-facing token generation)
  # ===========================================================================
  kiosk:
    image: fairq-kiosk:latest
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # ===========================================================================
  # MANAGEMENT FRONTEND (Admin dashboard)
  # ===========================================================================
  management:
    image: fairq-management:latest
    build:
      context: ./frontend-management
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - api
    restart: unless-stopped

  # ===========================================================================
  # COUNTER FRONTEND (Counter display)
  # ===========================================================================
  counter:
    image: fairq-counter:latest
    build:
      context: ./frontend-counter
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "5175:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
